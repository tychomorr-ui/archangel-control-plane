[project]
name = "archangel-sovereign-api"
version = "1.0.0"
description = "Build-only scoped application integration API for ARCHANGEL"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "cryptography>=43,<45",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
